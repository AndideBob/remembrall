# Remembrall — service composition
#
# Wires the shared internal network + persistent volumes and runs the stack.
# Each application service exposes a /health endpoint used as its container
# healthcheck. The frontend and reverse-proxy are declared but not yet active.

x-healthcheck: &health
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  # --- Vector DB: Chroma ---------------------------------------------------
  vector-db:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma-data:/data
    networks:
      - remembrall
    # Not published to the host — reachable internally at http://vector-db:8000
    expose:
      - "8000"

  # --- Chroma admin UI -----------------------------------------------------
  # Local development/inspection tool only — not for production use. Runs on the
  # internal network so it reaches the database at http://vector-db:8000 without
  # exposing the database itself; only this UI is published to the host.
  chroma-admin:
    image: fengzhichao/chromadb-admin
    restart: unless-stopped
    networks:
      - remembrall
    ports:
      - "3001:3001"
    depends_on:
      - vector-db

  # --- Ingestion -----------------------------------------------------------
  ingestion:
    build: ./ingestion
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/uploads
    networks:
      - remembrall
    # Published for local development/testing only — not for production use.
    ports:
      - "8002:8000"
    depends_on:
      - vector-db
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  # --- API -----------------------------------------------------------------
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/uploads
    networks:
      - remembrall
    # Published for local development/testing only — not for production use.
    ports:
      - "8001:8000"
    depends_on:
      - vector-db
      - llm-gateway
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  # --- LLM gateway ---------------------------------------------------------
  llm-gateway:
    build: ./llm-gateway
    restart: unless-stopped
    env_file: .env
    networks:
      - remembrall
    # Published for local development/testing only — not for production use.
    ports:
      - "8003:8000"
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  # --- Frontend (not yet active) -------------------------------------------
  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   networks:
  #     - remembrall

  # --- Reverse proxy: Caddy (not yet active) -------------------------------
  # reverse-proxy:
  #   image: caddy:latest
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile
  #     - caddy-data:/data
  #   networks:
  #     - remembrall
  #   depends_on:
  #     - api
  #     - frontend

networks:
  remembrall:
    driver: bridge

volumes:
  chroma-data:
  uploads:
  # caddy-data:   # uncomment when the reverse-proxy service is activated
