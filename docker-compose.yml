# Remembrall — service composition
#
# Phase 0: this file wires the shared network + persistent volumes and starts
# Chroma (an off-the-shelf image). The custom-built services below are declared
# but commented out; uncomment each in Phase 1 as it gains a Dockerfile and a
# health endpoint, so `docker compose up` never references a missing build.

services:
  # --- Vector DB: Chroma (active) ------------------------------------------
  vector-db:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma-data:/data
    networks:
      - remembrall
    # Not published to the host — reachable internally at http://vector-db:8000
    expose:
      - "8000"

